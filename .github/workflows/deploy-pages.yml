name: Deploy Leonmint to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build static Pages bundle
        run: npm run build:pages
      - name: Verify pages and asset paths
        run: |
          test -f _site/.nojekyll
          test -f _site/map/index.html
          test -f _site/coins/index.html
          test -f _site/create/index.html
          test -f _site/claim/index.html
          grep -q '/Leonmint/_next/static/' _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
